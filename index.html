<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EVERYTHING IS COMPUTER</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2305070a'/%3E%3Crect x='2' y='3' width='12' height='9' fill='none' stroke='%235cffae'/%3E%3Cpath d='M4 6h3M4 8h5' stroke='%235cffae'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="gl"></canvas>

      <div id="vignette"></div>
    </div>

    <div id="loading"><span>LOADING DECK</span><b id="pct">0%</b></div>

    <!--
      Clips play HERE, in plain DOM above the canvas — never through the CRT
      pipeline. No curvature, no scanlines, no bloom on the footage itself.
    -->
    <div id="player" hidden>
      <div id="player-scrim"></div>
      <figure id="player-frame">
        <video id="player-video" controls playsinline preload="metadata"></video>

        <!-- Sits over the video once it runs out, in the deck's own vocabulary. -->
        <div id="player-end" hidden>
          <p id="player-end-title">── END OF RECORD ──</p>
          <p id="player-end-meta"></p>
          <div id="player-end-actions">
            <button type="button" data-act="replay">↺ REPLAY</button>
            <button type="button" data-act="next">NEXT ▸</button>
            <button type="button" data-act="close">CLOSE ✕</button>
          </div>
        </div>
        <figcaption>
          <span id="player-code"></span>
          <b id="player-label"></b>
          <span id="player-note"></span>
        </figcaption>
        <button id="player-close" type="button" aria-label="Close clip">CLOSE ✕</button>
      </figure>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
