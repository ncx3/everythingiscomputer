<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GENOCYBER // placement test</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2305070a'/%3E%3Crect x='2' y='3' width='12' height='9' fill='none' stroke='%235cffae'/%3E%3Cpath d='M4 6h3M4 8h5' stroke='%235cffae'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="gl"></canvas>

      <!-- Proof-of-concept for the locked-camera hybrid: this DOM rect is
           positioned every frame from the projected screen mesh. In the real
           build the TUI lives in here as real HTML. -->
      <div id="domlayer" hidden>
        <div id="domrect">
          <span class="tag">DOM LAYER — real HTML renders here</span>
        </div>
      </div>

      <div id="vignette"></div>
    </div>

    <div id="loading"><span>LOADING DECK</span><b id="pct">0%</b></div>

    <aside id="hud">
      <div class="hud-title">PLACEMENT TEST</div>
      <div class="hud-row">
        <button data-state="contain" class="on">1 · CONTAIN</button>
        <button data-state="cover">2 · COVER</button>
        <button data-state="docked">3 · DOCKED</button>
      </div>
      <div class="hud-row">
        <button data-toggle="dom">D · DOM RECT</button>
        <button data-toggle="bloom" class="on">B · BLOOM</button>
        <button data-toggle="drift">R · DRIFT</button>
      </div>
      <div class="hud-note">drag look · scroll dolly · [ ] section · ↑↓ record</div>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
