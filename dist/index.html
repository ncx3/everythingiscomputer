<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GENOCYBER // placement test</title>
    <script type="module" crossorigin src="/assets/index-DsvblrpF.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BspAZTwV.css">
  </head>
  <body>
    <div id="stage">
      <canvas id="gl"></canvas>

      <!-- Proof-of-concept for the locked-camera hybrid: this DOM rect is
           positioned every frame from the projected screen mesh. In the real
           build the TUI lives in here as real HTML. -->
      <div id="domlayer" hidden>
        <div id="domrect">
          <span class="tag">DOM LAYER — real HTML renders here</span>
        </div>
      </div>

      <div id="vignette"></div>
    </div>

    <div id="loading"><span>LOADING DECK</span><b id="pct">0%</b></div>

    <aside id="hud">
      <div class="hud-title">PLACEMENT TEST</div>
      <div class="hud-row">
        <button data-state="contain" class="on">1 · CONTAIN</button>
        <button data-state="cover">2 · COVER</button>
        <button data-state="docked">3 · DOCKED</button>
      </div>
      <div class="hud-row">
        <button data-toggle="dom">D · DOM RECT</button>
        <button data-toggle="bloom" class="on">B · BLOOM</button>
        <button data-toggle="spin">R · DRIFT</button>
      </div>
      <div class="hud-note">drag to look · scroll to dolly</div>
    </aside>

  </body>
</html>
